name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Pack
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: multer-tgz
          path: ./multer-*.tgz
          if-no-files-found: error
